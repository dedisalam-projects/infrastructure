services:
  mongodb:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=app_db
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongodb/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - backend_network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.runCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  rabbitmq:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend_network
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    networks:
      - backend_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3

  gateway:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M
    build:
      context: ../backend
      dockerfile: docker/gateway/Dockerfile
    container_name: gateway
    restart: unless-stopped
    environment:
      - NODE_OPTIONS=--max-old-space-size=512
      - NODE_ENV=development
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=15m
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
    networks:
      - backend_network
    depends_on:
      user-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      blip-services:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  user-service:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M
    build:
      context: ../backend
      dockerfile: docker/user-service/Dockerfile
    container_name: user-service
    restart: unless-stopped
    environment:
      - NODE_OPTIONS=--max-old-space-size=512
      - NODE_ENV=development
      - PORT=3011
      - MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    networks:
      - backend_network
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3011/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  notification-service:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M
    build:
      context: ../backend
      dockerfile: docker/notification-service/Dockerfile
    container_name: notification-service
    restart: unless-stopped
    environment:
      - NODE_OPTIONS=--max-old-space-size=512
      - NODE_ENV=development
      - PORT=3012
      - MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017?authSource=admin
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
    networks:
      - backend_network
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3012/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  blip-services:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M
    build:
      context: ../backend
      dockerfile: docker/blip-services/Dockerfile
    container_name: blip-services
    restart: unless-stopped
    environment:
      - NODE_OPTIONS=--max-old-space-size=512
      - NODE_ENV=development
      - PORT=3013
      - MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - PDF_OPENPDF_HOST=pdf-openpdf
      - PDF_OPENPDF_PORT=8081
      - PDF_WKHTML_HOST=pdf-wkhtmltopdf
      - PDF_WKHTML_PORT=8082
      - PDF_WEASYPRINT_HOST=pdf-weasyprint
      - PDF_WEASYPRINT_PORT=8083
      - PDF_DOMPDF_HOST=pdf-dompdf
      - PDF_DOMPDF_PORT=8084
    networks:
      - backend_network
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      pdf-openpdf:
        condition: service_healthy
      pdf-wkhtmltopdf:
        condition: service_healthy
      pdf-weasyprint:
        condition: service_healthy
      pdf-dompdf:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3013/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  auth-service:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M
    build:
      context: ../backend
      dockerfile: docker/auth-service/Dockerfile
    container_name: auth-service
    restart: unless-stopped
    environment:
      - NODE_OPTIONS=--max-old-space-size=512
      - NODE_ENV=development
      - PORT=3015
      - MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=15m
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    networks:
      - backend_network
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3015/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  pdf-openpdf:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M
    build:
      context: ../backend
      dockerfile: docker/engines/openpdf/Dockerfile
    container_name: pdf-openpdf
    restart: unless-stopped
    ports:
      - '8081:8081'
    networks:
      - backend_network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8081/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  pdf-wkhtmltopdf:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M
    build:
      context: ../backend
      dockerfile: docker/engines/wkhtmltopdf/Dockerfile
    container_name: pdf-wkhtmltopdf
    restart: unless-stopped
    ports:
      - '8082:8082'
    networks:
      - backend_network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8082/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  pdf-weasyprint:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M
    build:
      context: ../backend
      dockerfile: docker/engines/weasyprint/Dockerfile
    container_name: pdf-weasyprint
    restart: unless-stopped
    ports:
      - '8083:8083'
    networks:
      - backend_network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8083/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  pdf-dompdf:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M
    build:
      context: ../backend
      dockerfile: docker/engines/dompdf/Dockerfile
    container_name: pdf-dompdf
    restart: unless-stopped
    ports:
      - '8084:8084'
    networks:
      - backend_network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8084/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M
    build:
      context: ../frontend
      dockerfile: docker/web/Dockerfile.dev
    container_name: web
    restart: unless-stopped
    volumes:
      - ../frontend:/app
      - /app/node_modules
    networks:
      - backend_network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:4200']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M
    image: nginxinc/nginx-unprivileged:1.25-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - '80:8080'
      - '443:8443'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    networks:
      - backend_network
      - cloudflare
    depends_on:
      gateway:
        condition: service_healthy
      user-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      blip-services:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      web:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  prometheus:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - backend_network

  grafana:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    ports:
      - '3050:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - backend_network
    depends_on:
      - prometheus

networks:
  backend_network:
    driver: bridge
  cloudflare:
    external: true

volumes:
  mongodb_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
