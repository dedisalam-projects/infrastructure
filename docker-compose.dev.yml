services:
  mongodb:
    extends:
      file: docker-compose.yml
      service: mongodb
    ports:
      - '127.0.0.1:27017:27017'

  rabbitmq:
    extends:
      file: docker-compose.yml
      service: rabbitmq
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'

  redis:
    extends:
      file: docker-compose.yml
      service: redis
    ports:
      - '127.0.0.1:6379:6379'

  gateway:
    extends:
      file: docker-compose.yml
      service: gateway
    image: dedisalam/backend-gateway:latest
    ports:
      - '3000:3000'

  user-service:
    extends:
      file: docker-compose.yml
      service: user-service
    image: dedisalam/backend-user-service:latest

  notification-service:
    extends:
      file: docker-compose.yml
      service: notification-service
    image: dedisalam/backend-notification-service:latest

  blip-services:
    extends:
      file: docker-compose.yml
      service: blip-services
    image: dedisalam/backend-blip-services:latest

  auth-service:
    extends:
      file: docker-compose.yml
      service: auth-service
    image: dedisalam/backend-auth-service:latest

  pdf-openpdf:
    extends:
      file: docker-compose.yml
      service: pdf-openpdf

  pdf-wkhtmltopdf:
    extends:
      file: docker-compose.yml
      service: pdf-wkhtmltopdf

  pdf-weasyprint:
    extends:
      file: docker-compose.yml
      service: pdf-weasyprint

  pdf-dompdf:
    extends:
      file: docker-compose.yml
      service: pdf-dompdf

networks:
  backend_network:
    driver: bridge
  cloudflare:
    external: true

volumes:
  mongodb_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
