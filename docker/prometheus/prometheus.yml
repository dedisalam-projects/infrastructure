global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'nestjs-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['gateway:3000']

  - job_name: 'nestjs-user-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['user-service:3001']

  - job_name: 'nestjs-notification-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['notification-service:3002']
