global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    scrape_interval: 10s
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node-exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'rabbitmq'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: 'nestjs-gateway'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['gateway:3000']

  - job_name: 'nestjs-user-service'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['user-service:3001']

  - job_name: 'nestjs-notification-service'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['notification-service:3002']
